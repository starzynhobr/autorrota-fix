name: build

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Build
        shell: cmd
        run: build.bat
      - name: SHA-256
        shell: pwsh
        run: (Get-FileHash build\version.dll -Algorithm SHA256).Hash | Tee-Object build\version.dll.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: autorrota-fix
          path: |
            build/version.dll
            build/version.dll.sha256
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/version.dll
            build/version.dll.sha256
